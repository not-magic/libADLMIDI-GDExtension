name: Release

# Builds template_debug + template_release for linux/windows/macos/android/ios (arm64)/web, then
# packages demo/addons/ADLMIDI/ (source-free, binaries for every platform
# included) into a zip attached to a GitHub Release. The zip's internal
# layout is addons/ADLMIDI/..., so it extracts directly into a project's
# root (res://). That zip is what's meant to be distributed -- either
# linked directly, or used as the "Custom" download URL in a Godot Asset
# Library submission, since the Asset Library's GitHub-commit-based
# download can't include build output that (deliberately) isn't committed
# to the repo.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: linux
            os: ubuntu-latest
            args: ""
            is_native: true
          - name: windows
            platform: windows
            os: windows-latest
            args: ""
            is_native: true
          - name: macos
            platform: macos
            os: macos-latest
            args: ""
            is_native: true
          - name: android-arm64
            platform: android
            os: ubuntu-latest
            args: "arch=arm64"
            is_native: false
          - name: ios
            platform: ios
            os: macos-latest
            args: "arch=arm64"
            is_native: false
          - name: web
            platform: web
            os: ubuntu-latest
            args: ""
            is_native: false
          - name: web-nothreads
            platform: web
            os: ubuntu-latest
            args: "threads=no"
            is_native: false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons

      # ilammy/msvc-dev-cmd is unmaintained and stuck on the Node.js 20
      # runtime GitHub removed; vs-shell does the same job as a plain
      # PowerShell composite action, so it has no Node runtime to deprecate.
      - name: Set up MSVC
        if: matrix.platform == 'windows'
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Install Emscripten
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.11

      - name: Install Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.1.13356709"

      # Pinned godot-cpp/libADLMIDI commits, so bumping either submodule
      # invalidates the cache key too.
      - name: Get submodule revisions
        id: submodules
        shell: bash
        run: echo "hash=$(git submodule status | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache SCons build
        uses: actions/cache@v6
        with:
          path: .scons_cache
          key: scons-release-${{ matrix.name }}-${{ hashFiles('src/**', 'SConstruct') }}-${{ steps.submodules.outputs.hash }}
          restore-keys: |
            scons-release-${{ matrix.name }}-

      - name: Build template_debug
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
        run: scons platform=${{ matrix.platform }} ${{ matrix.args }} target=template_debug -j4

      - name: Build template_release
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
        run: scons platform=${{ matrix.platform }} ${{ matrix.args }} target=template_release -j4

      - name: Wrap iOS dylibs in xcframeworks
        if: matrix.platform == 'ios'
        working-directory: demo/addons/ADLMIDI/bin
        run: |
          for target in template_debug template_release; do
            xcodebuild -create-xcframework \
              -library libADLMIDI.ios.$target.arm64.dylib \
              -output libADLMIDI.ios.$target.xcframework
            rm libADLMIDI.ios.$target.arm64.dylib
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: adlmidi-bin-${{ matrix.name }}
          path: demo/addons/ADLMIDI/bin/

  package:
    name: Package addon
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download binaries for every platform
        uses: actions/download-artifact@v8
        with:
          pattern: adlmidi-bin-*
          path: demo/addons/ADLMIDI/bin
          merge-multiple: true

      - name: Zip addon
        run: |
          cp LICENSE demo/addons/ADLMIDI/LICENSE
          cd demo
          zip -r "${{ github.workspace }}/ADLMIDI.zip" addons/ADLMIDI

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ADLMIDI.zip
          generate_release_notes: true
